name: Flutter checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          python3 - <<'PY'
          import re
          for line in open('analyze.txt', encoding='utf-8'):
              m = re.match(r'\s*(error|warning|info)\s+[•-]\s+(.*?)\s+[•-]\s+(\S+?):(\d+):(\d+)\s+[•-]\s+(\S+)', line)
              if m:
                  level = 'error' if m[1] == 'error' else 'warning'
                  msg = m[2].replace('%', '%25')
                  print(f'::{level} file={m[3]},line={m[4]},col={m[5]},title={m[6]}::{msg}')
          PY
          exit $status

      - name: Test
        run: flutter test --file-reporter json:test-results.json

      - name: Annotate failed tests
        if: failure() && hashFiles('test-results.json') != ''
        run: |
          python3 - <<'PY'
          import json
          tests, errors, prints = {}, {}, {}
          for line in open('test-results.json', encoding='utf-8'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get('type') == 'testStart':
                  t = e['test']
                  tests[t['id']] = (t['name'], t.get('url') or '')
              elif e.get('type') == 'error':
                  errors.setdefault(e['testID'], []).append(e.get('error', ''))
              elif e.get('type') == 'print':
                  prints.setdefault(e['testID'], []).append(e.get('message', ''))
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          for tid, errs in errors.items():
              name, url = tests.get(tid, ('unknown', ''))
              path = url.split('/navilo/')[-1] if '/navilo/' in url else ''
              detail = '\n'.join(prints.get(tid, []))
              # Widget-test exceptions are printed before the error event.
              msg = esc(('\n'.join(errs) + '\n' + detail[-3000:])[:4000])
              loc = f' file={path}' if path else ''
              print(f'::error{loc} title={esc(name)[:200].replace(':', '%3A').replace(',', '%2C')}::{msg}')
          PY
