name: navilo
description: Kişisel kriterlerle ürün keşfi ve etiket değerlendirme prototipi.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  image_picker: ^1.2.1
  google_mlkit_text_recognition: ^0.17.1
  flutter:
    sdk: flutter
  mobile_scanner: ^7.4.2
  image_cropper: ^12.2.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/policy.json
    - assets/dietary.json
    - assets/curated_products.json
